<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻译 · xlt-workbench 原型 v2</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--line:#e3e6ee;--ink:#1c2030;--mute:#5b6275;--acc:#4f5bd5;--acc-d:#3a44b0;--acc-bg:#eceefc;--hl:#fff3c4}
@media (prefers-color-scheme:dark){:root{--bg:#14161f;--card:#1d2030;--line:#2e3348;--ink:#e8eaf3;--mute:#9aa1b8;--acc:#8590ff;--acc-d:#a9b1ff;--acc-bg:#262b4d;--hl:#4a4217}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
kbd{font:12px ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.muted{color:var(--mute);font-size:12px}
.sp{flex:1}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 12px;min-height:36px}
.btn:hover{border-color:var(--acc)}
.btn[aria-pressed=true]{background:var(--acc-bg);border-color:var(--acc);color:var(--acc-d)}
.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.pri:hover{background:var(--acc-d);color:#fff}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.src i{width:8px;height:8px;border-radius:50%;display:inline-block}

.app{display:flex;height:100vh}
aside{width:200px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:16px}
aside b{padding:0 8px;font-size:16px}
.grp small{display:block;color:var(--mute);font-size:12px;padding:0 8px 4px}
.grp div{padding:8px;border-radius:8px}
.grp .on{background:var(--acc-bg);color:var(--acc-d);font-weight:600}

/* 翻译流 */
.feed{width:340px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.comp{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.comp textarea{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;resize:none;min-height:64px;line-height:1.6}
.comp textarea:focus{outline:none;border-color:var(--acc)}
.srch{margin:10px 14px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 12px;min-height:36px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px}
.chips button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:0 10px;min-height:28px;font-size:12px;color:var(--mute)}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.list{flex:1;overflow:auto;padding:0 8px 12px}
.it{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 10px;margin-bottom:2px}
.it:hover{background:var(--bg)}
.it[aria-current=true]{background:var(--acc-bg)}
.it .m{display:flex;gap:8px;align-items:center;margin-bottom:2px}
.it .o{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .t{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.hint{color:var(--mute);padding:16px 10px;font-size:13px}

/* 工作区 */
.work{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.wh{padding:16px 24px 8px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.wh h2{margin:4px 0 0;font-size:18px;font-weight:600;line-height:1.4}
.meta{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:12px}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 24px 12px;border-bottom:1px solid var(--line)}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:0 14px;min-height:36px}
.pill:hover{border-color:var(--acc)}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mute);border-radius:8px;padding:0 12px;min-height:30px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:600}
.wbody{flex:1;display:flex;min-height:0}
.wmain{flex:1;min-width:0;overflow:auto;padding:8px 24px 16px}
.shotbar{display:flex;gap:14px;align-items:center;margin:12px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.thumb{width:84px;height:48px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:11px;flex:none}
.row{display:grid;grid-template-columns:1fr 1fr 56px;gap:0 24px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .o{font-size:14.5px;line-height:1.75;color:var(--mute)}
.row .t{font:17px/1.8 "Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif}
.row .ra{display:flex;gap:2px;opacity:0;align-self:start}
.row:hover .ra,.row:focus-within .ra{opacity:1}
.row .ra button{border:0;background:transparent;color:var(--mute);width:28px;height:28px;border-radius:6px}
.row .ra button:hover{background:var(--acc-bg);color:var(--acc-d)}
.row:hover{background:linear-gradient(90deg,transparent,transparent)}
.ovr{margin-left:8px;font:11px -apple-system,"PingFang SC",sans-serif;color:var(--acc-d);background:var(--acc-bg);border-radius:99px;padding:0 8px}
.alt{grid-column:2;margin-top:6px;font-size:14px;line-height:1.7;color:var(--mute);border-left:2px solid var(--line);padding-left:10px}
.alt span{display:block;font-size:11px}
mark.gl{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.gloss{width:270px;flex:none;border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:14px}
.gloss h3{margin:0 0 4px;font-size:14px}
.gloss .tr{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.gloss .tr span{flex:1}
.gloss .tr button{border:0;background:transparent;color:var(--mute);width:28px;height:28px;border-radius:6px}
.gloss .add{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.gloss input{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;min-height:34px}
.wf{display:flex;gap:8px;flex-wrap:wrap;padding:10px 24px;border-top:1px solid var(--line);background:var(--card)}
.empty{margin:auto;color:var(--mute)}

/* 快捷面板 */
.mask{position:fixed;inset:0;background:rgba(10,12,24,.35);display:none;align-items:flex-start;justify-content:center;padding-top:9vh;z-index:10}
.mask.on{display:flex}
.qp{--qb:#14172a;--qb2:#1c2036;--ql:#2b3050;--qi:#e9ecf8;--qm:#8e95b5;--qa:#8590ff;--qpaper:#f4f6fc;--qink:#1c2030;--qpm:#55607a;width:min(450px,94vw);background:var(--qb);color:var(--qi);border:1px solid var(--ql);border-radius:20px;padding:8px 10px 10px;box-shadow:0 20px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px}
.qp svg{display:block}
.qp kbd{background:#262b4a;border-color:#363c63;color:var(--qm)}
.qp .tp{display:flex;align-items:center;gap:4px;padding-left:6px}
.qp .chip{font-size:12px;color:var(--qm);background:var(--qb2);border-radius:99px;padding:2px 10px}
.qp .ib{border:0;background:transparent;color:var(--qm);width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.qp .ib:hover{background:var(--qb2);color:var(--qi)}
.qp .ib[aria-pressed=true]{color:var(--qa)}
.qp .in{background:var(--qb2);border:1px solid var(--ql);border-radius:14px;padding:10px 12px 8px}
.qp .in:focus-within{border-color:var(--qa)}
.qp textarea{background:transparent;border:0;color:var(--qi);font-size:15px;line-height:1.6;min-height:58px;resize:none;width:100%}
.qp textarea:focus{outline:none}
.qp textarea::placeholder{color:var(--qm)}
.qp .ir{display:flex;align-items:center;gap:6px}
.qp .pill{border:1px solid var(--ql);background:transparent;color:var(--qi);min-height:32px;font-size:13px}
.qp .go{margin-left:auto;border:0;background:var(--qa);color:#101328;font-weight:700;border-radius:10px;padding:0 16px;min-height:36px}
.qp .hint{color:var(--qm);padding:14px 8px;font-size:13px}
.qp .paper{background:var(--qpaper);color:var(--qink);border-radius:14px;padding:12px 16px 10px}
.qp .pm{display:flex;justify-content:space-between;color:var(--qpm);font-size:12px}
.qp .pt{font:18px/1.75 "Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;margin:6px 0 8px}
.qp .terms{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qp .term{font-size:12px;color:var(--qpm);border:1px solid #d3d9ea;border-radius:99px;padding:0 9px}
.qp .strip{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid #dde2f0;padding-top:8px}
.qp .strip button{border:1px solid #d3d9ea;background:transparent;color:var(--qpm);border-radius:8px;padding:0 10px;min-height:32px;font-size:13px}
.qp .strip button[aria-pressed=true]{background:var(--qink);border-color:var(--qink);color:#fff}
.qp .ft{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.qp .ft button{border:0;background:transparent;color:var(--qi);border-radius:8px;padding:0 10px;min-height:36px}
.qp .ft button:hover{background:var(--qb2)}
.qp .ft .rep,.qp .ft .ex{color:var(--qa);font-weight:600}
.qp .ft .k{color:var(--qm);font-size:12px}

.ff{padding:10px 14px;border-top:1px solid var(--line)}
.set{flex:1;display:flex;min-height:0}
.snav{width:170px;flex:none;border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.snav button{border:0;background:transparent;text-align:left;border-radius:8px;padding:0 12px;min-height:38px;color:var(--mute)}
.snav button[aria-current=true]{background:var(--acc-bg);color:var(--acc-d);font-weight:600}
.sbody{flex:1;overflow:auto;padding:20px 28px 32px}
.sbody section{max-width:760px}
.sbody h3{margin:0 0 4px;font-size:15px}
.lead{color:var(--mute);margin-bottom:14px;font-size:13px}
.svc{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
.sh{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.sn{flex:1;min-width:160px;display:flex;flex-direction:column}
.ib2{border:1px solid var(--line);background:transparent;border-radius:8px;width:32px;height:32px;color:var(--mute)}
.ib2:hover{border-color:var(--acc)}
.sf{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.fr{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.fr input,.fr select,.fr textarea,.sbody select{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;min-height:34px}
.fr textarea{padding:8px 10px;min-height:64px;line-height:1.6}
.sg{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 16px;margin-bottom:16px}
.sg h4{margin:14px 0 0;font-size:13px;color:var(--mute);font-weight:600}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.sg .srow:last-child{border-bottom:0}
.srow b{font-weight:500}
.srow small{display:block;color:var(--mute);font-size:12px;font-weight:400}
.srow input[type=checkbox],.sh input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.kb{min-width:170px;font:13px ui-monospace,Menlo,monospace}
.warn{color:#b3261e;font-size:13px;margin:0 0 12px}
@media (prefers-color-scheme:dark){.warn{color:#ff9a90}}
@media (max-width:1100px){aside{display:none}}
@media (max-width:860px){.set{flex-direction:column}.snav{width:100%;flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.app{flex-direction:column;height:auto}.feed{width:100%;max-height:60vh}.row{grid-template-columns:1fr}.alt{grid-column:1}.row .ra{opacity:1}.gloss{width:100%;border-left:0;border-top:1px solid var(--line)}.wbody{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside>
<b>xlt-workbench</b>
<div class="grp"><small>用量</small><div>概览</div><div>分析</div></div>
<div class="grp"><small>Skills</small><div>安装面板</div></div>
<div class="grp"><small>工具</small><div class="on">翻译</div><div>剪贴板历史</div><div>密钥库</div></div>
<div class="grp"><small>系统</small><div>设置</div></div>
</aside>

<section class="feed" aria-label="翻译流">
<div class="comp">
<textarea id="cIn" placeholder="输入或粘贴要翻译的文本，Enter 翻译" aria-label="新翻译"></textarea>
<div class="bar">
<button class="btn" id="cShot" title="截图识别 Alt+S">截图</button>
<button class="btn" id="openSel" title="模拟划词 Alt+D">划词</button>
<button class="btn" id="openQp" title="快捷面板 Alt+Space">面板</button>
<span class="sp"></span>
<button class="btn pri" id="cGo">翻译</button>
</div>
</div>
<input class="srch" id="q" placeholder="搜索原文或译文" aria-label="搜索">
<div class="chips" id="fchips"></div>
<div class="list" id="list"></div>
<div class="ff"><button class="btn" id="openSet" style="width:100%">设置：服务 / 识别 / 快捷键 / 常规</button></div>
</section>

<main class="work" id="work"></main>
</div>

<!-- 快捷面板 -->
<div class="mask" id="mask" aria-hidden="true">
<div class="qp" role="dialog" aria-label="快捷面板">
<div class="tp">
<span class="chip" id="qMode">输入翻译</span><span class="sp"></span>
<button class="ib" id="qPin" aria-label="固定面板" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 3H8v2l1 1v5l-3 3v2h5v5h2v-5h5v-2l-3-3V6l1-1z"/></svg></button>
<button class="ib" id="qClose" aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
<div class="in">
<textarea id="qIn" placeholder="输入或粘贴文本，停顿后自动翻译" aria-label="要翻译的文本"></textarea>
<div class="ir"><button class="pill" id="qLang" aria-label="切换语言方向"></button><button class="go" id="qGo">翻译 <kbd>Enter</kbd></button></div>
</div>
<div id="qRes"></div>
<div class="ft" id="qAct" hidden>
<button id="qCopy">复制译文</button><button id="qFav">收藏</button>
<button class="rep" id="qRep" hidden>替换选区</button>
<button class="ex" id="qEx">展开到工作区</button>
<span class="sp"></span><span class="k"><kbd>Esc</kbd> 关闭</span>
</div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const flash=(el,t)=>{const o=el.textContent;el.textContent=t;setTimeout(()=>el.textContent=o,1200);};
const copy=t=>navigator.clipboard&&navigator.clipboard.writeText(t);

const ENG=["有道翻译","DeepL","LLM（OpenAI 兼容）"];
const short=i=>ENG[i].split("（")[0];
const PAIRS=["自动 → 简体中文","简体中文 → English","自动 → English"];
const A1="Attention mechanisms allow a model to focus on relevant parts of the input sequence when producing each element of the output.";
const A2="Self-attention relates different positions of a single sequence in order to compute a representation of the sequence.";
const A3="The Transformer relies entirely on self-attention to compute representations of its input and output without using sequence-aligned RNNs.";
const D={};
D[A1]=["注意力机制使模型能够在生成输出的每个元素时，聚焦于输入序列中的相关部分。","注意力机制允许模型在生成输出的每个元素时，关注输入序列的相关部分。","注意力机制让模型在产出每个输出元素时，聚焦于输入序列里相关的部分。"];
D[A2]=["自注意力将单个序列的不同位置关联起来，以计算该序列的表示。","自注意力把同一序列中不同位置联系起来，从而得到该序列的表示。","自注意力关联单个序列的各个位置，用来计算这个序列的表示。"];
D[A3]=["Transformer 完全依赖自注意力来计算输入和输出的表示，而不使用序列对齐的循环神经网络。","Transformer 完全依靠自注意力计算其输入和输出的表示，不使用序列对齐的 RNN。","Transformer 只依赖自注意力来计算输入与输出的表示，不用序列对齐的 RNN。"];
D["representation"]=["表示；表征","表示","表征"];
const mk=text=>text.trim().split(/(?<=[.!?。！？])\s+/).filter(Boolean).map(o=>({o:o,t:D[o]||["〔示例译文〕"+o,"〔示例译文〕"+o,"〔示例译文〕"+o]}));

const SRC={input:["输入","#8e95b5"],select:["划词","#6f7bff"],shot:["截图","#1fa58a"],clip:["剪贴板","#d58a1f"]};
const FIL=[["all","全部"],["input","输入"],["select","划词"],["shot","截图"],["clip","剪贴板"],["star","收藏"]];
const S={sel:1,filter:"all",eng:0,cmp:false,acad:true,gloss:false,pair:0,nid:5,
  terms:[["attention mechanism","注意力机制"],["self-attention","自注意力"],["representation","表示"],["sequence","序列"],["RNN","循环神经网络"]]};
const items=[
 {id:1,src:"select",app:"Safari",time:"10:21",star:true,sents:mk(A1+" "+A2+" "+A3),ov:{}},
 {id:2,src:"shot",app:"屏幕",time:"10:24",star:false,sents:mk(A2),ov:{},ocr:{size:"412 × 96",eng:"系统 OCR（离线）",conf:"98%"}},
 {id:3,src:"input",app:"手动输入",time:"昨天",star:true,sents:mk("representation"),ov:{}},
 {id:4,src:"clip",app:"剪贴板",time:"昨天",star:false,sents:mk(A3),ov:{}}
];
const cur=()=>items.find(i=>i.id===S.sel);

function visible(){
  const k=$("#q").value.trim().toLowerCase();
  return items.filter(it=>(S.filter==="all"||(S.filter==="star"?it.star:it.src===S.filter))&&(!k||it.sents.some(x=>(x.o+x.t[0]).toLowerCase().includes(k))));
}
function srcTag(s){return '<span class="src"><i style="background:'+SRC[s][1]+'"></i>'+SRC[s][0]+'</span>';}
function renderFeed(){
  $("#fchips").innerHTML=FIL.map(f=>{
    const n=items.filter(it=>f[0]==="all"||(f[0]==="star"?it.star:it.src===f[0])).length;
    return '<button data-f="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+f[1]+' '+n+'</button>';
  }).join("");
  const v=visible();
  $("#list").innerHTML=v.length?v.map(it=>'<button class="it" data-id="'+it.id+'" aria-current="'+(S.view==="main"&&it.id===S.sel)+'"><div class="m">'+srcTag(it.src)+'<span class="muted">'+it.time+'</span>'+(it.star?'<span class="muted" aria-label="已收藏">★</span>':'')+'</div><div class="o">'+esc(it.sents[0].o)+'</div><div class="t">'+esc(it.sents[0].t[0])+'</div></button>').join(""):'<div class="hint">没有匹配的记录</div>';
}
function hl(zh){
  const safe=esc(zh);
  if(!S.acad)return safe;
  const zs=S.terms.map(t=>t[1]).filter(z=>z&&/[\u4e00-\u9fa5]/.test(z)).sort((a,b)=>b.length-a.length);
  if(!zs.length)return safe;
  const re=new RegExp(zs.map(z=>z.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g");
  return safe.replace(re,m=>'<mark class="gl" title="术语表">'+m+'</mark>');
}
function renderWork(){
  if(S.view==="settings"){renderSettings();return;}
  const it=cur();
  if(!it){$("#work").innerHTML='<div class="empty">在左侧选择一条记录，或输入新的翻译</div>';return;}
  const e0=S.eng;

function onSettingsClick(ev){

  if(d.open!==undefined){S.set.open=S.set.open===d.open?null:d.open;renderSettings();return;}
  if(d.def){const q=d.def.split(":"),arr=q[0]==="t"?TSVC:OSVC;S.set[q[0]==="t"?"tdef":"odef"]=arr[+q[1]].n;renderSettings();return;}

  if(d.save){flash(b,"已保存");return;}

  if(b.id==="kReset"){KEYS.forEach(k=>S.set.keys[k[0]]=k[2]);S.keyMsg="";renderSettings();return;}
  if(b.id==="sAdd"){TSVC.push({n:"自定义服务 "+(TSVC.length-4),tag:"OpenAI 兼容",on:false,fields:[["Base URL",""],["模型",""],["API Key","@vault"]]});S.set.open="t:"+(TSVC.length-1);renderSettings();return;}

document.addEventListener("keydown",e=>{
  if(!S.cap)return;
  e.preventDefault();e.stopImmediatePropagation();
  if(e.key==="Escape"){S.cap=null;S.keyMsg="";renderSettings();return;}
  if(["Control","Alt","Shift","Meta"].indexOf(e.key)>=0)return;
  const mods=[e.ctrlKey&&"Ctrl",e.altKey&&"Alt",e.shiftKey&&"Shift",e.metaKey&&"Cmd"].filter(Boolean);
  if(!mods.length){S.keyMsg="全局快捷键需要包含 Ctrl / Alt / Shift / Cmd 之一";renderSettings();return;}
  const k=e.code.indexOf("Key")===0?e.code.slice(3):e.code.indexOf("Digit")===0?e.code.slice(5):e.code==="Space"?"Space":(e.key.length===1?e.key.toUpperCase():e.key);
  const combo=mods.concat(k).join("+");
  const dup=KEYS.find(x=>x[0]!==S.cap&&S.set.keys[x[0]]===combo);
  if(dup){S.keyMsg="与「"+dup[1]+"」冲突，请换一个组合";renderSettings();return;}
  S.set.keys[S.cap]=combo;S.cap=null;S.keyMsg="";renderSettings();
},true);
$("#openSet").onclick=()=>{S.view="settings";renderFeed();renderWork();};

renderFeed();renderWork();
</script>
</body>
</html>
